<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Trang quản lý - Hy Vọng Mới</title>
     <link rel="stylesheet" th:href="@{/css/manager/baocao.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    
      <div class="dashboard-container">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="sidebar-header">
          <h2>Hy Vọng Mới</h2>
          <div class="user-info">
            <div class="user-avatar">M</div>
            <div class="user-details">
              <h3 th:text="${customerName}">Tên Người Dùng</h3>
            </div>
          </div>
        </div>
        <ul class="sidebar-nav">
          <li class="nav-item">
            <a th:href="@{/manager/baocao}">
              <i class="fas fa-file-alt"></i><span>TẠO BÁO CÁO</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/manager/quanlybacsi}">
              <i class="fas fa-user-md"></i><span>QUẢN LÝ BÁC SĨ</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/manager/quanlydichvu}">
              <i class="fas fa-heartbeat"></i><span>QUẢN LÝ DỊCH VỤ</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/manager/quanlydanhgia}">
              <i class="fas fa-star-half-alt"></i><span>QUẢN LÝ ĐÁNH GIÁ</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/manager/quanlylichkham}">
              <i class="fas fa-calendar-check"></i><span>QUẢN LÝ LỊCH KHÁM</span>
            </a>
          </li>
        </ul>
      </nav>
      </div>
      <main class="main-content">
  <section class="welcome-banner">
    <div class="welcome-text">
      <h1>👋 Chào mừng trở lại!</h1>
      <p th:text="'Xin chào, ' + ${customerName} + '! Chúc bạn một ngày làm việc hiệu quả.'">
        Xin chào!
      </p>
    </div>
    <div class="welcome-icon">
      <i class="fas fa-user-cog"></i>
    </div>
  </section>
</main>

    </div>
  </body>
</html>
