<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý Đánh giá - Hy Vọng Mới</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/css/manager/quanlydanhgia.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
<div class="dashboard-container">
  <!-- Sidebar -->
   <nav class="sidebar">
        <div class="sidebar-header">
          <h2>Hy Vọng Mới</h2>
          <div class="user-info">
            <div class="user-avatar">M</div>
            <div class="user-details">
              <h3 th:text="${customerName}">Tên Người Dùng</h3>
            </div>
          </div>
        </div>
        <ul class="sidebar-nav">
          <li class="nav-item">
            <a th:href="@{/manager/baocao}">
              <i class="fas fa-file-alt"></i><span>TẠO BÁO CÁO</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/manager/quanlybacsi}">
              <i class="fas fa-user-md"></i><span>QUẢN LÝ BÁC SĨ</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/manager/quanlydichvu}">
              <i class="fas fa-heartbeat"></i><span>QUẢN LÝ DỊCH VỤ</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/manager/quanlydanhgia}">
              <i class="fas fa-star-half-alt"></i><span>QUẢN LÝ ĐÁNH GIÁ</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/manager/quanlylichkham}">
              <i class="fas fa-calendar-check"></i><span>QUẢN LÝ LỊCH KHÁM</span>
            </a>
          </li>
        </ul>
        </ul>
      </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="top-right">
      <form th:action="@{/auth/logout}" method="post">
        <button type="submit" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </button>
      </form>
    </div>

    <div class="content-page active">
      <div class="page-header">
        <h1>Quản lý Đánh giá</h1>
      </div>

      <section class="review-table">
  <h2>Danh sách đánh giá</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Tên bác sĩ</th>
        <th>Dịch vụ</th>
        <th>Mức độ hài lòng</th>
        <th>Nhận xét</th>
        <th>Email bệnh nhân</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="dg : ${danhGiaList}">
  <td th:text="${dg.id}"></td>
  <td th:text="${dg.tenBacSi}"></td>
  <td th:text="${dg.dichVu}"></td>
  <td th:text="${dg.mucDoHaiLong}"></td>
  <td th:text="${dg.nhanXet}"></td>
  <td th:text="${dg.emailBenhNhan}"></td>
  <td>
    <span th:text="${dg.daXem ? 'Đã xem' : 'Chưa xem'}"
          th:classappend="${dg.daXem} ? 'badge badge-read' : 'badge badge-unread'">
    </span>
  </td>
  <td>
    <form th:action="@{'/manager/quanlydanhgia/delete/' + ${dg.id}}" method="post">
      <button type="submit" class="btn btn-delete">Xóa</button>
    </form>
    <form th:if="${!dg.daXem}" th:action="@{'/manager/quanlydanhgia/mark-read/' + ${dg.id}}" method="post">
      <button type="submit" class="btn btn-edit">Đánh dấu đã xem</button>
    </form>
  </td>
</tr>

    </tbody>
  </table>
</section>

    </div>
  </main>
</div>

<script th:src="@{/js/manager/quanlydanhgia.js}" defer></script>
</body>
</html>
