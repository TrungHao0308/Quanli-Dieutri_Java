<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Lập kế hoạch điều trị</title>
    <link rel="stylesheet" th:href="@{/css/chung/lichtrunggian.css}" />
  </head>
  <body>
    <p>Đang đăng nhập với role: <span th:text="${role}"></span></p>
    <div style="margin-top: 20px">
      <a th:if="${role == 'ROLE_DOCTOR'}" th:href="@{/doctor/dashboard}">
        <button>Quay lại trang bác sĩ</button>
      </a>
      <a th:if="${role == 'ROLE_CUSTOMER'}" th:href="@{/customer}">
        <button>Quay lại trang bệnh nhân</button>
      </a>
    </div>

    <h1>Lập kết hoạch điều trị</h1>

    <!-- Chỉ bác sĩ mới được thấy form thêm -->
    <div th:if="${role == 'ROLE_DOCTOR'}">
      <h2>Thêm lịch điều trị mới</h2>
      <form th:action="@{/doctor/lichtrunggian/them}" method="post">
        <label>Email bệnh nhân:</label>
        <select name="emailBenhNhan">
          <option value="">-- Chọn --</option>
          <option
            th:each="lich : ${phanCongList}"
            th:value="${lich.emailBenhNhan}"
            th:text="${lich.emailBenhNhan}"
          ></option>
        </select>
        <br />

        <label>Tên bệnh nhân:</label>
        <input type="text" id="tenBenhNhan" name="tenBenhNhan" /><br />

        <label>Ngày khám:</label>
        <input type="date" id="ngayKham" name="ngayKham" /><br />

        <label>Dịch vụ:</label>
        <input type="text" id="tenDichVu" name="tenDichVu" /><br />

        <label>Chi tiết:</label>
        <textarea id="chiTiet" name="chiTiet"></textarea><br />

        <hr />

        <label>Lịch xét nghiệm:</label>
        <input type="date" name="lichXetNghiem" /><br />

        <label>Lịch tiêm thuốc:</label>
        <input type="date" name="lichTiemThuoc" /><br />

        <label>Lịch tái khám:</label>
        <input type="date" name="lichTaiKham" /><br />

        <button type="submit">Tạo lịch trình khám</button>
      </form>
    </div>

    <h3>Danh sách lịch điều trị đã lập</h3>
    <table>
      <thead>
        <tr>
          <th>Email bệnh nhân</th>
          <th>Tên</th>
          <th>Ngày khám</th>
          <th>Dịch vụ</th>
          <th>Lịch xét nghiệm</th>
          <th>Lịch tiêm thuốc</th>
          <th>Lịch tái khám</th>
          <th>Hành động</th>
          <th th:if="${role == 'ROLE_CUSTOMER'}">Email bác sĩ</th>
          <th th:if="${role == 'ROLE_CUSTOMER'}">Tên bác sĩ</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="lich : ${lichKhams}">
          <td th:text="${lich.emailBenhNhan}"></td>
          <td th:text="${lich.tenBenhNhan}"></td>
          <td th:text="${lich.ngayKham}"></td>
          <td th:text="${lich.tenDichVu}"></td>
          <td th:text="${lich.lichXetNghiem}"></td>
          <td th:text="${lich.lichTiemThuoc}"></td>
          <td th:text="${lich.lichTaiKham}"></td>

          <!-- Bác sĩ được xóa -->
          <td th:if="${role == 'ROLE_DOCTOR'}">
            <form
              th:action="@{/doctor/lichtrunggian/xoa/{id}(id=${lich.id})}"
              method="post"
              onsubmit="return confirm('Bạn chắc chắn muốn xóa lịch này?');"
            >
              <button type="submit">Xóa</button>
            </form>
          </td>

          <!-- Khách thì không có nút xóa -->
          <td th:if="${role != 'ROLE_DOCTOR'}">—</td>
          <td
            th:if="${role == 'ROLE_CUSTOMER'}"
            th:text="${lich.emailBacSi}"
          ></td>
          <td
            th:if="${role == 'ROLE_CUSTOMER'}"
            th:text="${lich.tenBacSi}"
          ></td>
        </tr>
      </tbody>
    </table>

    <script th:src="@{/js/chung/lichtrunggian.js}"></script>
  </body>
</html>
